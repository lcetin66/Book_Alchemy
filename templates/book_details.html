{% extends "layout.html" %}

{% block title %}{{ book.title }} — Details{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 800px; display: flex; gap: 3rem; align-items: flex-start; text-align: left;">
    <img src="https://covers.openlibrary.org/b/isbn/{{ book.isbn }}-L.jpg" alt="{{ book.title }}" style="width: 300px; border-radius: 12px; border: 1px solid var(--border-color); padding: 5px; background: white;">
    
    <div style="flex: 1;">
        <h2 style="font-family: 'Playfair Display', serif; font-size: 3rem; margin-top: 0;">{{ book.title }}</h2>
        <p style="font-size: 1.2rem; margin-bottom: 2rem;">
            by <a href="{{ url_for('author_details', author_id=book.author.id) }}" style="color: var(--accent); font-weight: 700;">{{ book.author.name }}</a>
        </p>
        
        <div style="border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
            <p><strong>Published:</strong> {{ book.publication_year }}</p>
            <p><strong>ISBN:</strong> {{ book.isbn }}</p>
            <p><strong>Database ID:</strong> #{{ book.id }}</p>
        </div>

        <div style="margin-top: 3rem; display: flex; gap: 1rem;">
            <a href="/" class="btn-action" style="padding: 0.6rem 1.5rem;">Back</a>
            <form action="{{ url_for('delete_book', book_id=book.id) }}" method="POST" onsubmit="return confirm('Are you sure?');">
                <button type="submit" class="btn-delete" style="opacity: 1; padding: 0.6rem 1.5rem; border: 1px solid #cc0000;">Remove from Collection</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
