{% extends "layout.html" %}

{% block title %}New Book — Book Alchemy{% endblock %}

{% block content %}
<div class="form-card">
    <h2 style="font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 3rem;">Catalog Book</h2>
    <form action="/add_book" method="POST">
        <div class="form-group">
            <label for="isbn">ISBN Identifier</label>
            <input type="text" id="isbn" name="isbn" required placeholder="9780000000000">
        </div>
        
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required placeholder="The Great Gatsby">
        </div>
        
        <div class="form-group">
            <label for="publication_year">Year of Release</label>
            <input type="text" id="publication_year" name="publication_year" required placeholder="1925">
        </div>
        
        <div class="form-group">
            <label for="author_id">Author</label>
            <select name="author_id" id="author_id" required>
                <option value="">Choose from records...</option>
                {% for author in authors %}
                    <option value="{{ author.id }}">{{ author.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <button type="submit" class="btn-submit">Add to Archive</button>
    </form>
    
    <p style="margin-top: 3rem; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">
        <a href="/" style="color: var(--text-secondary); text-decoration: none;">&larr; Return to Library</a>
    </p>
</div>
{% endblock %}
