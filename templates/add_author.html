{% extends "layout.html" %}

{% block title %}New Author — Book Alchemy{% endblock %}

{% block content %}
<div class="form-card">
    <h2 style="font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 3rem;">Register Author</h2>
    <form method="POST">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required placeholder="J.R.R. Tolkien">
        </div>
        
        <div class="form-group">
            <label for="birthdate">Born</label>
            <input type="date" id="birthdate" name="birthdate" required>
        </div>
        
        <div class="form-group">
            <label for="date_of_death">Passed Away (Optional)</label>
            <input type="date" id="date_of_death" name="date_of_death">
        </div>
        
        <button type="submit" class="btn-submit">Add to Archive</button>
    </form>
    
    <p style="margin-top: 3rem; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">
        <a href="/" style="color: var(--text-secondary); text-decoration: none;">&larr; Return to Library</a>
    </p>
</div>
{% endblock %}
